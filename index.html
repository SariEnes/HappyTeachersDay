<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#14121a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>DO TO LEARN: The Presentation Trap</title>
    <meta name="description" content="A pixel-art Teachers' Day surprise for CEIT 111 at METU." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8' shape-rendering='crispEdges'%3E%3Crect width='8' height='8' fill='%2314121a'/%3E%3Crect x='1' y='3' width='6' height='4' fill='%23f2c14e'/%3E%3Crect x='3' y='1' width='2' height='6' fill='%23d63031'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #14121a;
        --ink: #f4f1e8;
        --muted: #9a94a8;
        --accent: #f0b44c;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        overflow: hidden;
        overscroll-behavior: none; /* no pull-to-refresh / rubber-banding */
        -webkit-tap-highlight-color: transparent;
        -webkit-text-size-adjust: 100%;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Press Start 2P', ui-monospace, monospace;
        color: var(--ink);
      }
      #game {
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        touch-action: none; /* the canvas owns all touch gestures */
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        box-shadow: 0 0 0 4px #000, 0 12px 40px rgba(0, 0, 0, 0.6);
      }
      #hud {
        position: fixed;
        top: max(12px, env(safe-area-inset-top));
        left: max(16px, env(safe-area-inset-left));
        z-index: 10;
        pointer-events: none;
        text-shadow: 2px 2px 0 #000;
        line-height: 1.7;
      }
      #hud .title { font-size: 12px; color: var(--accent); }
      #hud .title span { color: var(--ink); }
      #hud .hint { font-size: 8px; color: var(--muted); transition: opacity 1s; }
      #hud-right {
        position: fixed;
        top: max(12px, env(safe-area-inset-top));
        right: max(16px, env(safe-area-inset-right));
        z-index: 60;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 8px;
      }
      #fps {
        font-size: 8px;
        color: var(--muted);
        text-shadow: 2px 2px 0 #000;
        pointer-events: none;
      }
      /* phones & small windows: keep only the essentials over the game */
      @media (max-width: 700px), (max-height: 500px) {
        #hud { top: max(6px, env(safe-area-inset-top)); left: max(6px, env(safe-area-inset-left)); }
        #hud .title, #hud .hint { display: none; }
        #hud-right { top: max(6px, env(safe-area-inset-top)); right: max(6px, env(safe-area-inset-right)); gap: 4px; }
        #fps { display: none; }
        #game { box-shadow: 0 0 0 2px #000; }
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hud">
      <div class="title">DO TO LEARN: <span>The Presentation Trap</span></div>
      <div class="hint" id="hint">WASD / ARROWS: WALK &nbsp;·&nbsp; E / SPACE: INTERACT</div>
    </div>
    <div id="hud-right"><div id="fps"></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
